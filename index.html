<style>
    :root {
        --bg: #0b0e14;
        --panel: #161b22;
        --accent: #58a6ff; /* Серйозний синій, як у GitHub/Microsoft */
        --text: #c9d1d9;
        --user-msg: #21262d;
    }

    body { 
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
        background: var(--bg); 
        color: var(--text); 
        display: flex; 
        align-items: center; 
        justify-content: center; 
        height: 100vh; 
        margin: 0; 
    }

    #chat-container { 
        width: 90%; 
        max-width: 1000px; 
        height: 85vh;
        background: var(--panel); 
        border: 1px solid #30363d;
        border-radius: 12px; 
        display: flex;
        flex-direction: column;
        box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        overflow: hidden;
    }

    h2 { 
        font-size: 14px;
        font-weight: 600;
        padding: 15px 20px;
        margin: 0;
        background: rgba(255,255,255,0.03);
        border-bottom: 1px solid #30363d;
        color: var(--accent);
        display: flex;
        align-items: center;
        gap: 10px;
    }

    h2::before {
        content: '';
        width: 8px;
        height: 8px;
        background: #238636; /* Зелений індикатор статусу */
        border-radius: 50%;
        display: inline-block;
    }

    #chat-box { 
        flex: 1;
        overflow-y: auto; 
        padding: 25px; 
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    .message { 
        max-width: 80%;
        padding: 12px 16px; 
        border-radius: 10px;
        line-height: 1.5;
        font-size: 15px;
        position: relative;
    }

    .user-msg { 
        align-self: flex-end; 
        background: var(--accent); 
        color: #fff;
    }

    .ai-msg { 
        align-self: flex-start; 
        background: var(--user-msg); 
        border: 1px solid #30363d;
    }

    .label {
        font-size: 11px;
        text-transform: uppercase;
        margin-bottom: 4px;
        opacity: 0.7;
        display: block;
    }

    #input-area { 
        padding: 20px;
        background: rgba(0,0,0,0.2);
        display: flex; 
        gap: 10px; 
    }

    input { 
        flex: 1; 
        padding: 12px 20px; 
        background: #0d1117; 
        border: 1px solid #30363d; 
        border-radius: 6px;
        color: #fff; 
        font-size: 15px;
        transition: 0.2s;
    }

    input:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.1);
    }

    button { 
        padding: 0 25px; 
        background: var(--accent); 
        border: none; 
        border-radius: 6px;
        color: #fff; 
        font-weight: 600;
        cursor: pointer; 
        transition: 0.2s;
    }

    button:hover { opacity: 0.9; transform: translateY(-1px); }

    .system-msg { 
        text-align: center;
        color: #8b949e; 
        font-size: 12px; 
        margin: 5px 0;
    }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 10px; }
</style>

<div id="chat-container">
    <h2>U-A-CORE 2.0 | Advanced Intelligence System</h2>
    <div id="chat-box">
        <div class="system-msg">Систему ініціалізовано. Усі модулі працюють штатно.</div>
        <div class="message ai-msg">
            <span class="label">System Core</span>
            Вітаю, Олександре. Протоколи активовані. Готовий до роботи.
        </div>
    </div>
    <div id="input-area">
        <input type="text" id="userInput" placeholder="Введіть запит..." autocomplete="off">
        <button onclick="sendMessage()">Надіслати</button>
    </div>
</div>
