<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>U-A-CORE 2.0 | SDU SYSTEM</title>
    <style>
        /* ПОВНИЙ ПЕРЕЗАВАНТАЖЕННЯ ДИЗАЙНУ */
        :root {
            --main-bg: #0d1117;
            --card-bg: #161b22;
            --accent: #58a6ff;
            --text: #f0f6fc;
            --border: #30363d;
        }

        body {
            background: var(--main-bg);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #chat-container {
            width: 90%;
            max-width: 900px;
            height: 85vh;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        header {
            padding: 20px;
            background: rgba(255,255,255,0.03);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h2 {
            margin: 0;
            font-size: 16px;
            color: var(--accent);
            letter-spacing: 1px;
        }

        #chat-box {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: var(--main-bg);
        }

        .message {
            max-width: 80%;
            padding: 14px 18px;
            border-radius: 12px;
            font-size: 15px;
            line-height: 1.5;
        }

        .ai-msg {
            align-self: flex-start;
            background: var(--card-bg);
            border: 1px solid var(--border);
        }

        .user-msg {
            align-self: flex-end;
            background: var(--accent);
            color: white;
        }

        #input-area {
            padding: 20px;
            background: var(--card-bg);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 12px;
        }

        input {
            flex: 1;
            background: var(--main-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 15px;
            color: white;
            outline: none;
        }

        input:focus { border-color: var(--accent); }

        button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0 25px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover { opacity: 0.8; }
    </style>
</head>
<body>

<div id="chat-container">
    <header>
        <h2>U-A-CORE v2.0 ONLINE</h2>
        <div style="font-size: 12px; color: #8b949e;">CPU i7-4790 | GPU RX 570</div>
    </header>
    
    <div id="chat-box">
        <div class="message ai-msg">Система готова. Вітаю, Олександре. Чекаю на твій запит.</div>
    </div>

    <div id="input-area">
        <input type="text" id="userInput" placeholder="Введіть команду..." autocomplete="off">
        <button onclick="sendMessage()">RUN</button>
    </div>
</div>

<script>
    const KEY = 'AIzaSyColLu4_IspH17YO5H5Lv2jt-M7dQBxO10';
    const MODEL_NAME = "gemini-1.5-flash-latest";

    async function sendMessage() {
        const input = document.getElementById('userInput');
        const chatBox = document.getElementById('chat-box');
        const userText = input.value.trim();

        if (!userText) return;

        chatBox.innerHTML += `<div class="message user-msg">${userText}</div>`;
        input.value = '';
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${KEY}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: userText }] }] })
            });

            const data = await response.json();
            const resultText = data.candidates[0].content.parts[0].text;

            chatBox.innerHTML += `<div class="message ai-msg">${resultText}</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        } catch (err) {
            chatBox.innerHTML += `<div style="color:red; font-size:12px;">Помилка: ${err.message}</div>`;
        }
    }

    document.getElementById('userInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });
</script>

</body>
</html>
