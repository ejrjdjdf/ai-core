<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>U-A-CORE | ALPHA 1.0.0</title>
    <link rel="stylesheet" href="style.css?v=4">
</head>
<body>

<div class="app-wrapper">
    <aside>
        <div class="logo-area">
            <div class="logo-u">U</div>
            <div class="logo-text">A-CORE 2.0</div>
        </div>
        
        <div class="nav-list">
            <div class="sidebar-section">
                <span class="section-title">FREQUENCY_SCAN</span>
                <div class="visualizer">
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                </div>
            </div>
        </div>

        <div class="system-footer">
            SDU AI SYSTEM v1.0.0<br>
            <span class="pulse-text">● ALPHA_BUILD</span>
        </div>
    </aside>

    <main>
        <div id="chat-box">
            <div class="msg-group ai-group">
                <div class="msg-header">SDU_CORE</div>
                <div class="message ai-msg">Вітаю. Система U-A-CORE активована в режимі Alpha 1.0.0. Очікую команди.</div>
            </div>
        </div>

        <div class="input-area">
            <div class="input-container">
                <input type="text" id="userInput" placeholder="Написати запрос..." autocomplete="off">
                <button id="sendBtn">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="3">
                        <path d="M5 12h14M12 5l7 7-7 7"/>
                    </svg>
                </button>
            </div>
        </div>
    </main>
</div>

<script src="script.js"></script>
</body>
</html>
