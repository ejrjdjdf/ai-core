<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>U-A-CORE | ALPHA 1.0.0</title>
    <link rel="stylesheet" href="style.css?v=final_alpha">
</head>
<body>

<div class="app-wrapper">
    <aside>
        <div class="logo-area">
            <div class="logo-u">U</div>
            <div class="logo-text">A-CORE 2.0</div>
        </div>
        
        <div class="nav-list">
            <div class="sidebar-section full-height">
                <span class="section-title">CORE_VIBRATION</span>
                <div class="visualizer-full">
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                </div>
            </div>
        </div>

        <div class="system-footer">
            SDU AI SYSTEM v1.0.0<br>
            <span class="pulse-text">● ALPHA_BUILD</span>
        </div>
    </aside>

    <main>
        <div id="chat-box"></div>

        <div class="input-area">
            <div class="input-container">
                <input type="text" id="userInput" placeholder="Написати запрос..." autocomplete="off">
                <button id="sendBtn">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </button>
            </div>
        </div>
    </main>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB12aMvm2OZqapf2bjR-4hkESZeTiblJYg",
    authDomain: "ai-core-v2.firebaseapp.com",
    databaseURL: "https://ai-core-v2-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "ai-core-v2",
    storageBucket: "ai-core-v2.firebasestorage.app",
    messagingSenderId: "830503834257",
    appId: "1:830503834257:web:837bd348eb62b297882530",
    measurementId: "G-MSW2BS4W2D"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  // Перекидаємо функції в глобальне вікно для script.js
  window.db = db;
  window.dbRef = ref;
  window.dbPush = push;
  window.dbOnValue = onValue;
</script>

<script src="script.js"></script>
</body>
</html>
