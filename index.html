<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>U-A-CORE | SDU Intelligence</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0c10;
            --sidebar-bg: #11141a;
            --accent: #00f2ff; /* Аквамарин SDU Style */
            --accent-dark: #0088cc;
            --text-main: #e6edf3;
            --border: rgba(255, 255, 255, 0.08);
            --glass: rgba(255, 255, 255, 0.03);
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-dark);
            color: var(--text-main);
            overflow: hidden;
        }

        .app-wrapper {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        /* БІЧНА ПАНЕЛЬ (SIDEBAR) */
        aside {
            width: 280px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            transition: 0.3s;
        }

        .logo-area {
            padding: 30px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.3);
        }

        .logo-text {
            font-weight: 800;
            font-size: 18px;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #fff, #888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-list {
            flex: 1;
            padding: 10px;
        }

        .nav-item {
            padding: 12px 15px;
            border-radius: 10px;
            font-size: 14px;
            color: #8b949e;
            cursor: pointer;
            margin-bottom: 5px;
            transition: 0.2s;
        }

        .nav-item:hover {
            background: var(--glass);
            color: #fff;
        }

        .nav-item.active {
            background: rgba(0, 242, 255, 0.1);
            color: var(--accent);
            font-weight: 600;
        }

        /* ГОЛОВНИЙ КОНТЕНТ */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        header {
            height: 70px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 40px;
            justify-content: space-between;
            background: rgba(10, 12, 16, 0.7);
            backdrop-filter: blur(20px);
            z-index: 10;
        }

        .system-info {
            display: flex;
            gap: 20px;
            font-size: 12px;
            color: #484f58;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #3fb950;
            font-weight: 600;
        }

        #chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 40px 15%;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        /* ПОВІДОМЛЕННЯ */
        .msg-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .msg-header {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #484f58;
        }

        .message {
            max-width: 90%;
            padding: 2px 0;
            font-size: 16px;
            line-height: 1.7;
        }

        .user-msg { color: #fff; }
        .ai-msg { color: #c9d1d9; }

        /* ПОЛЕ ВВОДУ (ЯК У ВЕБ-ДОДАТКАХ) */
        .input-area {
            padding: 20px 15% 40px 15%;
            background: linear-gradient(to top, var(--bg-dark) 60%, transparent);
        }

        .input-container {
            background: #161b22;
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        input {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            padding: 12px;
            font-size: 16px;
            outline: none;
        }

        button {
            background: var(--accent);
            color: #000;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.4);
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
    </style>
</head>
<body>

<div class="app-wrapper">
    <aside>
        <div class="logo-area">
            <div class="logo-icon"></div>
            <div class="logo-text">U-A-CORE 2.0</div>
        </div>
        
        <nav class="nav-list">
            <div class="nav-item active">Основний термінал</div>
            <div class="nav-item">Історія сесій</div>
            <div class="nav-item">SDU Модулі</div>
            <div class="nav-item">Налаштування Ядра</div>
        </nav>

        <div style="padding: 20px; font-size: 11px; color: #30363d; border-top: 1px solid var(--border);">
            SDU AI SYSTEM v2.0.4<br>
            STABLE RELEASE
        </div>
    </aside>

    <main>
        <header>
            <div class="status-badge">● SYSTEM_ONLINE</div>
            <div class="system-info">
                <span>LATENCY: 24ms</span>
                <span>ENC: AES-256</span>
            </div>
        </header>

        <div id="chat-box">
            <div class="msg-group">
                <div class="msg-header">System Core Intelligence</div>
                <div class="message ai-msg">Вітаю, Олександре. Систему ініціалізовано. Чекаю на твої вказівки.</div>
            </div>
        </div>

        <div class="input-area">
            <div class="input-container">
                <input type="text" id="userInput" placeholder="Надіслати повідомлення..." autocomplete="off">
                <button onclick="sendMessage()">↑</button>
            </div>
        </div>
    </main>
</div>

<script>
    const KEY = 'AIzaSyColLu4_IspH17YO5H5Lv2jt-M7dQBxO10'; 
    const MODEL_NAME = "gemini-1.5-flash-latest";

    async function sendMessage() {
        const input = document.getElementById('userInput');
        const chatBox = document.getElementById('chat-box');
        const userText = input.value.trim();

        if (!userText) return;

        chatBox.innerHTML += `
            <div class="msg-group" style="align-items: flex-start;">
                <div class="msg-header" style="color: var(--accent);">Александр</div>
                <div class="message user-msg">${userText}</div>
            </div>`;
        
        input.value = '';
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${KEY}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: userText }] }] })
            });

            const data = await response.json();
            const resultText = data.candidates[0].content.parts[0].text;

            chatBox.innerHTML += `
                <div class="msg-group">
                    <div class="msg-header">Core Intelligence</div>
                    <div class="message ai-msg">${resultText}</div>
                </div>`;
            
            chatBox.scrollTop = chatBox.scrollHeight;
        } catch (err) {
            console.error(err);
        }
    }

    document.getElementById('userInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });
</script>

</body>
</html>
