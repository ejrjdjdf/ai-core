<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>U-A-CORE | Intelligence System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #05070a;
            --panel: #0d1117;
            --accent: #2f81f7; /* Професійний синій */
            --text-main: #adbac7;
            --border: #30363d;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            height: 100vh;
        }

        /* Бокова панель */
        aside {
            width: 260px;
            background: var(--panel);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .brand {
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 1px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand::before {
            content: '';
            width: 12px;
            height: 12px;
            background: var(--accent);
            border-radius: 3px;
        }

        .nav-item {
            padding: 10px;
            font-size: 13px;
            color: #768390;
            border-radius: 6px;
            margin-bottom: 5px;
            cursor: pointer;
        }

        .nav-item.active {
            background: rgba(47, 129, 247, 0.1);
            color: var(--accent);
        }

        /* Головна частина */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: radial-gradient(circle at top right, #10141d, #05070a);
        }

        header {
            height: 60px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 30px;
            justify-content: space-between;
            font-size: 12px;
            background: rgba(13, 17, 23, 0.5);
            backdrop-filter: blur(10px);
        }

        #chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 40px 15%;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .msg-container {
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        .msg-label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 6px;
            color: #768390;
        }

        .message {
            max-width: 85%;
            padding: 16px 20px;
            border-radius: 12px;
            line-height: 1.6;
            font-size: 15px;
            border: 1px solid transparent;
        }

        .user-msg {
            align-self: flex-end;
            background: #1c2128;
            border-color: var(--border);
            color: #fff;
        }

        .ai-msg {
            align-self: flex-start;
            background: rgba(47, 129, 247, 0.05);
            border-color: rgba(47, 129, 247, 0.2);
            color: #cdd9e5;
        }

        /* Поле вводу */
        .input-area {
            padding: 30px 15%;
            background: linear-gradient(to top, var(--bg) 80%, transparent);
        }

        .input-container {
            background: #1c2128;
            border: 1px solid var(--border);
            border-radius: 12px;
            display: flex;
            padding: 10px;
            transition: 0.3s;
        }

        .input-container:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(47, 129, 247, 0.1);
        }

        input {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            padding: 10px 15px;
            font-size: 16px;
            outline: none;
        }

        button {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 0 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover { background: #478ef8; }

        /* Скролл */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 10px; }
    </style>
</head>
<body>

    <aside>
        <div class="brand">U-A-CORE</div>
        <div class="nav-item active">Головний термінал</div>
        <div class="nav-item">Аналіз логів</div>
        <div class="nav-item">Налаштування вузла</div>
        
        <div style="margin-top: auto; font-size: 11px; color: #444;">
            BUILD: 2026.05.11<br>
            STATUS: ACTIVE
        </div>
    </aside>

    <main>
        <header>
            <span>ВУЗОЛ: KRYVYI-RIH-01</span>
            <span style="color: #238636;">● СИСТЕМА ПРАЦЮЄ ШТАТНО</span>
        </header>

        <div id="chat-box">
            <div class="msg-container">
                <span class="msg-label">U-A-CORE Intelligence</span>
                <div class="message ai-msg">
                    Систему ініціалізовано. Протоколи версії 2.0 активовані. Готовий до обробки даних, Олександре.
                </div>
            </div>
        </div>

        <div class="input-area">
            <div class="input-container">
                <input type="text" id="userInput" placeholder="Введіть команду..." autocomplete="off">
                <button onclick="sendMessage()">RUN</button>
            </div>
        </div>
    </main>

    <script>
        const KEY = 'AIzaSyColLu4_IspH17YO5H5Lv2jt-M7dQBxO10'; 
        const MODEL_NAME = "gemini-1.5-flash-latest";

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const chatBox = document.getElementById('chat-box');
            const userText = input.value.trim();

            if (!userText) return;

            // Додаємо повідомлення користувача
            chatBox.innerHTML += `
                <div class="msg-container" style="align-items: flex-end;">
                    <span class="msg-label">Олександр</span>
                    <div class="message user-msg">${userText}</div>
                </div>`;
            
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: userText }] }]
                    })
                });

                const data = await response.json();
                const resultText = data.candidates[0].content.parts[0].text;

                // Додаємо відповідь ШІ
                chatBox.innerHTML += `
                    <div class="msg-container">
                        <span class="msg-label">U-A-CORE Intelligence</span>
                        <div class="message ai-msg">${resultText}</div>
                    </div>`;
                
                chatBox.scrollTop = chatBox.scrollHeight;
            } catch (err) {
                console.error(err);
                chatBox.innerHTML += `<div style="color: #f85149; font-size: 12px; text-align: center; margin: 10px;">[ERROR]: Зв'язок перервано.</div>`;
            }
        }
    </script>
</body>
</html>
