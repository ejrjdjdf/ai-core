<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>U-A-CORE 2.0 | SDU-AI SYSTEM</title>
    <style>
        :root {
            --bg-dark: #080a0c;
            --sidebar-bg: #0d1117;
            --main-accent: #00d4ff;
            --text-main: #e6edf3;
            --border-color: #30363d;
            --glass: rgba(255, 255, 255, 0.03);
        }

        body { 
            font-family: 'Inter', -apple-system, system-ui, sans-serif; 
            background: var(--bg-dark); 
            color: var(--text-main); 
            margin: 0; 
            display: flex; 
            height: 100vh;
            overflow: hidden;
        }

        /* Бічна панель з метриками */
        #sidebar {
            width: 280px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
        }

        .system-status {
            margin-bottom: 30px;
        }

        .status-item {
            font-size: 12px;
            margin-bottom: 15px;
            padding: 10px;
            background: var(--glass);
            border-radius: 6px;
            border-left: 3px solid var(--main-accent);
        }

        .status-label { color: #8b949e; text-transform: uppercase; font-size: 10px; display: block; }
        .status-value { font-weight: 600; display: block; margin-top: 4px; }

        /* Основний робочий простір */
        #main-view {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        header {
            padding: 15px 30px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(13, 17, 23, 0.8);
            backdrop-filter: blur(10px);
        }

        .logo { font-weight: 800; letter-spacing: 2px; color: var(--main-accent); font-size: 18px; }

        #chat-box { 
            flex: 1;
            overflow-y: auto; 
            padding: 40px 10%; 
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;
        }

        /* Стилізація повідомлень */
        .msg-wrapper { display: flex; flex-direction: column; width: 100%; }
        .user-row { align-items: flex-end; }
        .ai-row { align-items: flex-start; }

        .message { 
            max-width: 75%;
            padding: 15px 20px; 
            border-radius: 12px;
            line-height: 1.6;
            font-size: 15px;
        }

        .user-msg { 
            background: var(--main-accent); 
            color: #000;
            font-weight: 500;
            border-bottom-right-radius: 2px;
        }

        .ai-msg { 
            background: #161b22; 
            border: 1px solid var(--border-color);
            border-bottom-left-radius: 2px;
        }

        .msg-info { font-size: 10px; color: #8b949e; margin-bottom: 5px; text-transform: uppercase; }

        /* Поле вводу */
        #input-area { 
            padding: 30px 10%;
            background: linear-gradient(to top, var(--bg-dark), transparent);
        }

        .input-wrapper {
            display: flex;
            background: #161b22;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 8px;
            transition: 0.3s;
        }

        .input-wrapper:focus-within { border-color: var(--main-accent); box-shadow: 0 0 15px rgba(0, 212, 255, 0.2); }

        input { 
            flex: 1; 
            padding: 12px 15px; 
            background: transparent; 
            border: none; 
            color: #fff; 
            font-size: 16px;
            outline: none; 
        }

        button { 
            background: var(--main-accent); 
            border: none; 
            border-radius: 8px;
            color: #000; 
            padding: 0 25px;
            font-weight: 700;
            cursor: pointer; 
            transition: 0.2s;
        }

        button:hover { filter: brightness(1.2); transform: scale(1.02); }

        /* Скроллбар */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 10px; }
    </style>
</head>
<body>

    <aside id="sidebar">
        <div class="logo">U-A-CORE</div>
        <div style="font-size: 10px; color: #58a6ff; margin-bottom: 40px;">QUANTUM INTERFACE v2.0</div>
        
        <div class="system-status">
            <div class="status-item">
                <span class="status-label">Master User</span>
                <span class="status-value">Олександр</span>
            </div>
            <div class="status-item">
                <span class="status-label">Neural Engine</span>
                <span class="status-value">Gemini 3.0 Flash</span>
            </div>
            <div class="status-item">
                <span class="status-label">Hardware Link</span>
                <span class="status-value">i7-4790 | RX 570</span>
            </div>
            <div class="status-item">
                <span class="status-label">Status</span>
                <span class="status-value" style="color: #238636;">● ONLINE</span>
            </div>
        </div>
    </aside>

    <main id="main-view">
        <header>
            <div style="font-size: 12px; opacity: 0.6;">SESSION_ID: 0xFD226</div>
            <div style="font-size: 12px; opacity: 0.6;">KRYVYI RIH DETACHMENT</div>
        </header>

        <div id="chat-box">
            <div class="msg-wrapper ai-row">
                <span class="msg-info">System Core • Зараз</span>
                <div class="message ai-msg">Протоколи U-A-CORE активовані. Очікую введення директив, Олександре.</div>
            </div>
        </div>

        <div id="input-area">
            <div class="input-wrapper">
                <input type="text" id="userInput" placeholder="Введіть команду для системи..." autocomplete="off">
                <button onclick="sendMessage()">EXECUTE</button>
            </div>
        </div>
    </main>

    <script>
        const KEY = 'AIzaSyColLu4_IspH17YO5H5Lv2jt-M7dQBxO10'; 
        const MODEL_NAME = "gemini-1.5-flash-latest";

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const chatBox = document.getElementById('chat-box');
            const userText = input.value.trim();

            if (!userText) return;

            // Додаємо повідомлення користувача
            chatBox.innerHTML += `
                <div class="msg-wrapper user-row">
                    <span class="msg-info">User • Олександре</span>
                    <div class="message user-msg">${userText}</div>
                </div>`;
            
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: userText }] }]
                    })
                });

                const data = await response.json();
                const resultText = data.candidates[0].content.parts[0].text;

                // Додаємо відповідь ШІ
                chatBox.innerHTML += `
                    <div class="msg-wrapper ai-row">
                        <span class="msg-info">Core Intelligence</span>
                        <div class="message ai-msg">${resultText}</div>
                    </div>`;
                
                chatBox.scrollTop = chatBox.scrollHeight;
            } catch (err) {
                chatBox.innerHTML += `<div style="color: #ff4444; font-size: 12px; text-align:center;">[ERR]: Спроба зв'язку перервана: ${err.message}</div>`;
            }
        }
    </script>
</body>
</html>
