<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>U-A-CORE 2.0</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        #chat { width: 100%; max-width: 600px; height: 400px; border: 1px solid #333; overflow-y: auto; padding: 10px; margin-bottom: 10px; background: #1e1e1e; }
        input { width: 80%; padding: 10px; background: #333; border: none; color: white; }
        button { padding: 10px; background: #007bff; border: none; color: white; cursor: pointer; }
    </style>
</head>
<body>
    <h1>U-A-CORE 2.0 🤖</h1>
    <div id="chat"></div>
    <div>
        <input type="text" id="userInput" placeholder="Напиши щось...">
        <button onclick="sendMessage()">Відправити</button>
    </div>

    <script>
        async function sendMessage() {
            const input = document.getElementById('userInput');
            const chat = document.getElementById('chat');
            const userText = input.value;
            if (!userText) return;

            chat.innerHTML += `<p><b>Ти:</b> ${userText}</p>`;
            input.value = '';

            const API_KEY = 'ТВІЙ_КЛЮЧ_ТУТ'; // ВСТАВ СВІЙ КЛЮЧ СЮДИ
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash-latest:generateContent?key=${API_KEY}`;

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: userText }] }]
                    })
                });

                const data = await response.json();
                const aiText = data.candidates[0].content.parts[0].text;
                chat.innerHTML += `<p><b>U-A-CORE:</b> ${aiText}</p>`;
            } catch (error) {
                chat.innerHTML += `<p style="color:red"><b>Помилка:</b> Можливо, невірний API ключ або модель недоступна.</p>`;
                console.error(error);
            }
        }
    </script>
</body>
</html>
