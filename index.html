<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>U-A-CORE | Intelligence</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-wrapper">
    <aside>
        <div class="logo-area">
            <div class="logo-u">U</div>
            <div class="logo-text">A-CORE 2.0</div>
        </div>
        
        <div class="nav-list">
            <button class="new-chat-btn">+ Новий запит</button>
            
            <div class="sidebar-section">
                <span class="section-title">СИСТЕМА</span>
                <div class="stats-item">
                    <span>Core Activity</span>
                    <div class="progress-bar"><div class="progress-fill" style="width: 24%;"></div></div>
                </div>
                <div class="stats-item">
                    <span>Neural Link</span>
                    <div class="progress-bar"><div class="progress-fill" style="width: 65%;"></div></div>
                </div>
            </div>

            <div class="sidebar-section">
                <span class="section-title">ІСТОРІЯ</span>
                <div class="history-empty">База даних порожня...</div>
            </div>
        </div>

        <div class="system-footer">
            SDU AI SYSTEM v2.0.4 <br>
            <span style="color: #3fb950; font-size: 10px;">● CONNECTED</span>
        </div>
    </aside>

    <main>
        <header></header>

        <div id="chat-box">
            <div class="msg-group">
                <div class="msg-header">System</div>
                <div class="message ai-msg">Вітаю, я готовий до роботи.</div>
            </div>
        </div>

        <div class="input-area">
            <div class="input-container">
                <input type="text" id="userInput" placeholder="Введіть запит для ядра..." autocomplete="off">
                <button id="sendBtn">↑</button>
            </div>
        </div>
    </main>
</div>

<script src="script.js"></script>
</body>
</html>
