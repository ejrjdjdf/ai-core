<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>U-A-core v2.0 | Control Panel</title>
    <style>
        body {
            background-color: #0a0a0a;
            color: #00ff41;
            font-family: 'Consolas', 'Courier New', monospace;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        #header {
            padding: 10px 20px;
            background: #111;
            border-bottom: 2px solid #00ff41;
            text-shadow: 0 0 5px #00ff41;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
        }

        #chat-window {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: radial-gradient(circle, #1a1a1a 0%, #0a0a0a 100%);
        }

        .msg { padding: 12px; border-radius: 5px; max-width: 85%; line-height: 1.5; word-wrap: break-word; }
        .user { align-self: flex-end; color: #fff; border-right: 3px solid #00ff41; background: rgba(0, 255, 65, 0.1); }
        .ai { align-self: flex-start; border-left: 3px solid #00ff41; background: rgba(255, 255, 255, 0.05); }

        #input-container {
            display: flex;
            padding: 15px;
            background: #111;
            border-top: 1px solid #333;
        }

        input {
            flex: 1;
            background: #000;
            border: 1px solid #00ff41;
            color: #00ff41;
            padding: 12px;
            font-size: 16px;
            outline: none;
        }

        button {
            background: #00ff41;
            color: #000;
            border: none;
            padding: 0 25px;
            margin-left: 10px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
        }

        button:hover { background: #fff; box-shadow: 0 0 10px #00ff41; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0a0a0a; }
        ::-webkit-scrollbar-thumb { background: #00ff41; }
    </style>
</head>
<body>

<div id="header">
    <span>U-A-CORE v2.0 // BY ALEXANDER</span>
    <span id="status">STATUS: ONLINE</span>
</div>

<div id="chat-window">
    <div class="msg ai">Система U-A-core активована. Чекаю на запит...</div>
</div>

<div id="input-container">
    <input type="text" id="userInput" placeholder="Введіть команду..." onkeypress="if(event.key==='Enter')sendRequest()">
    <button onclick="sendRequest()">Execute</button>
</div>

<script>
    const KEY = "AIzaSyColLu4_IspH17YO5H5Lv2jt-M7dQBxO10";
    // Використовуємо v1beta - він найбільш сумісний з новими ключами
    const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${KEY}`;

    async function sendRequest() {
        const input = document.getElementById('userInput');
        const chat = document.getElementById('chat-window');
        const text = input.value.trim();

        if (!text) return;

        // Відображаємо повідомлення користувача
        chat.innerHTML += `<div class="msg user"><b>> USER:</b> ${text}</div>`;
        input.value = "";
        chat.scrollTop = chat.scrollHeight;

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{
                        parts: [{
                            text: `Ти - U-A-core v2.0, потужний ШІ. Тебе створив Олександр (йому 13 років). Ти знаєш все про Geometry Dash (Silent Nanste, 1.0 style) та залізо ПК (RX 570, 1660 Super). Відповідай українською мовою. Коротко і чітко. Питання: ${text}`
                        }]
                    }]
                })
            });

            if (!response.ok) {
                const errorData = await response.json();
                console.error("Помилка API:", errorData);
                throw new Error(`Server Error ${response.status}: ${errorData.error.message}`);
            }

            const data = await response.json();
            const reply = data.candidates[0].content.parts[0].text;

            chat.innerHTML += `<div class="msg ai"><b># U-A-CORE:</b> ${reply}</div>`;
        } catch (err) {
            console.error(err);
            chat.innerHTML += `<div class="msg ai" style="color: #ff3333;"><b>! SYSTEM ERROR:</b> ${err.message}</div>`;
        }

        chat.scrollTop = chat.scrollHeight;
    }
</script>

</body>
</html>
